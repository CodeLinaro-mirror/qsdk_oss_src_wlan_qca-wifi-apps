# udbg_enh server config
udbg_enh_server_ip_address=127.0.0.1
udbg_enh_server_port=55555

#maximum number of clients to be handled at once
udbg_enh_server_max_subscriptions=64
#maximum number of entries in the server log ring
udbg_enh_server_max_log_entries=16

# Liveness / stale handling
udbg_enh_liveness_check_interval_ms=1000
udbg_enh_stale_timeout_ms=30000

# UDP batching
udbg_enh_udp_batch_enable=1
udbg_enh_udp_batch_size=64
# Max time budget (microseconds) spent per batch cycle.
udbg_enh_udp_batch_budget_us=750

